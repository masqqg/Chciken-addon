# BytecodeVM base settings for METEOR EXTREME SHIELD.
#
# The pipeline appends an `includes:` block generated from
# bytecodevm-allowlist.txt and passes the result as the config. With an empty
# allowlist the layer never runs, which is the safe default.
#
# Hot paths are always excluded no matter what the allowlist says.
input: "./in.jar"
output: "./out.jar"

createMode: ONE_FOR_ALL
location: ONE_PACKAGE
renameMode: ENABLE
interpretMode: SAVE_ONLY_REQUIRED_INSTRUCTION
vmStructure: HIGH
vmCount: 3

excludes:
  - "method:* void onTick(*)*"
  - "method:* void onRender(*)*"
  - "method:* void onRender3D(*)*"
  - "method:* void onPacket(*)*"
  - "method:* void onActivate()*"
  - "method:* void onDeactivate()*"
  - "method:* void onChunkData(*)*"
  - "method:* void onBlockUpdate(*)*"
  - "class:com.example.addon.AddonTemplate"
  - "class:com.example.addon.mixin.*"
  - "class:sa.*"
  - "class:f5.*"
  - "class:com.google.*"

watermark:
  project: "METEOR EXTREME SHIELD"
