name: Publish Development Build
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 for Skidfuscator
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          java-package: jdk
      - run: echo "SKID_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build with Gradle
        run: ./gradlew build -PskidJavaHome="$SKID_JAVA_HOME"

      - name: Remove unobfuscated jars
        run: rm -f build/libs/*-dev.jar build/libs/*-sources.jar

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: |
            ./build/libs/*.jar
