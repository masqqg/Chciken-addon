name: Publish Development Build

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25 (Aidsfuscator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk

      - name: Remember the Java 25 home for Aidsfuscator
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Protect and sign
        run: ./protection/pipeline.sh
        env:
          UMBRA_PRESET: balanced

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: |
            ./dist/*.jar
            ./dist/SHA256SUMS
